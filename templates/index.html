<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta Mídia Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      font-size: 0.875rem;
      text-align: center;
      line-height: 1.4;
      word-break: break-word;
    }

    .badge {
      display: inline-block;
      background: #10b981;
      color: #000;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
  </style>

  <!-- Carrega a engine do FFmpeg direto no navegador -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

  <div class="card">
    <div style="text-align: center;"><span class="badge">100% OFFLINE</span></div>
    <h1>Corta Mídia Local</h1>
    
    <form id="cutForm">
      <div class="form-group">
        <label for="videoFile">Selecione o Vídeo (MP4, MKV, etc)</label>
        <input type="file" id="videoFile" accept="video/*" required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="start">Início (HH:MM:SS)</label>
          <input type="text" id="start" value="00:00:00" placeholder="00:00:00" required>
        </div>
        <div class="form-group">
          <label for="end">Fim (HH:MM:SS)</label>
          <input type="text" id="end" value="00:00:10" placeholder="00:00:10" required>
        </div>
      </div>

      <button type="submit" id="submitBtn">Cortar e Salvar</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    const form = document.getElementById('cutForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];
      const start = document.getElementById('start').value.trim();
      const end = document.getElementById('end').value.trim();

      if (!file) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'Carregando Engine...';
      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Inicializando o FFmpeg no aparelho...';

      try {
        if (!ffmpeg.isLoaded()) {
          await ffmpeg.load();
        }

        submitBtn.innerText = 'Processando...';
        statusDiv.innerText = 'Cortando o vídeo localmente...';

        // Carrega o arquivo para o sistema de arquivos virtual do WebAssembly
        const inputName = 'input_video.mp4';
        const outputName = 'corte_output.mp4';
        
        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        // Executa o corte ultra-rápido sem re-codificação (-c copy)
        await ffmpeg.run(
          '-ss', start,
          '-to', end,
          '-i', inputName,
          '-c', 'copy',
          outputName
        );

        // Lê o resultado da memória
        const data = ffmpeg.FS('readFile', outputName);

        // Gera o download do arquivo no celular
        const blob = new Blob([data.buffer], { type: 'video/mp4' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `corte_${file.name}`;
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusDiv.style.color = '#4ade80';
        statusDiv.innerText = 'Corte concluído com sucesso!';

      } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'Erro ao processar arquivo: ' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Cortar e Salvar';
      }
    });
  </script>
</body>
</html>
