<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta Mídia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      font-size: 0.875rem;
      text-align: center;
      line-height: 1.4;
      min-height: 20px;
    }

    .info-text {
      font-size: 0.75rem;
      color: #64748b;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Corta Mídia</h1>
    
    <form id="cutForm">
      <div class="form-group">
        <label for="url">URL do Vídeo</label>
        <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="start">Início (HH:MM:SS)</label>
          <input type="text" id="start" placeholder="00:00:10" value="00:00:00" required>
        </div>
        <div class="form-group">
          <label for="end">Fim (HH:MM:SS)</label>
          <input type="text" id="end" placeholder="00:00:30" required>
        </div>
      </div>

      <button type="submit" id="submitBtn">Processar e Baixar</button>
    </form>

    <div id="status"></div>
    <div class="info-text">Nota: A primeira requisição pode levar cerca de 50s para o servidor inicializar.</div>
  </div>

  <script>
    // URL do servidor no Render
    const API_URL = 'https://cortamidia-backend.onrender.com';

    const form = document.getElementById('cutForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const url = document.getElementById('url').value.trim();
      const start = document.getElementById('start').value.trim();
      const end = document.getElementById('end').value.trim();

      // Atualiza interface para estado de carregamento
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processando...';
      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Baixando e cortando a mídia no servidor... Por favor, aguarde.';

      try {
        const response = await fetch(`${API_URL}/cut`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ url, start, end })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || 'Erro ao processar mídia no servidor.');
        }

        statusDiv.style.color = '#4ade80';
        statusDiv.innerText = 'Corte concluído! Iniciando download...';

        // Recebe o arquivo em Blob e dispara o download automático
        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `corte_${Date.now()}.mp4`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(downloadUrl);

      } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = `Erro: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Processar e Baixar';
      }
    });
  </script>
</body>
</html>
