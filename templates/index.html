<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortaMídia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff3e3e; }
        input {
            width: 100%;
            max-width: 400px;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #222;
            color: #fff;
        }
        button {
            width: 100%;
            max-width: 424px;
            padding: 12px;
            background-color: #ff3e3e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #status { margin-top: 15px; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>
    <h1>CortaMídia 🎬</h1>
    <p>Cole o link do vídeo para baixar:</p>
    <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
    <button onclick="baixar()">Baixar Vídeo</button>
    <div id="status"></div>

    <script>
        async function baixar() {
            const url = document.getElementById('urlInput').value;
            const status = document.getElementById('status');
            
            if(!url) {
                status.innerText = "Por favor, cole uma URL.";
                return;
            }

            status.innerText = "Baixando vídeo... Aguarde!";
            
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const res = await response.json();
                status.innerText = res.message;
            } catch(e) {
                status.innerText = "Erro ao se conectar ao servidor local.";
            }
        }
    </script>
</body>
</html>
