<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corta Mídia Offline</title>
    
    <!-- Carrega o FFmpeg.wasm v0.11.6 compatível com WebView local -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .file-dropzone {
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #0f172a;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-dropzone label {
            cursor: pointer;
            display: block;
            word-break: break-all;
            color: #94a3b8;
        }

        input[type="file"] {
            display: none;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:active {
            background-color: #0369a1;
        }

        button:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Corta Mídia Offline</h1>

        <div class="file-dropzone">
            <!-- Hack do label para acionar o seletor nativo do Android -->
            <label for="videoInput" id="fileLabel">📁 Selecionar Vídeo</label>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <div class="inputs-grid">
            <div>
                <label for="startTime">Início</label>
                <input type="text" id="startTime" value="00:00:00">
            </div>
            <div>
                <label for="endTime">Fim</label>
                <input type="text" id="endTime" value="00:00:10">
            </div>
        </div>

        <button id="cutBtn" onclick="cortarVideo()">Cortar e Salvar</button>

        <div id="status"></div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        
        // Instancia sem opções adicionais para forçar o modo single-thread
        const ffmpeg = createFFmpeg({ log: true });

        const videoInput = document.getElementById('videoInput');
        const fileLabel = document.getElementById('fileLabel');
        const status = document.getElementById('status');
        const cutBtn = document.getElementById('cutBtn');

        // Atualiza a interface quando o arquivo for selecionado
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileLabel.innerHTML = `✅ ${file.name}`;
            }
        });

        async function cortarVideo() {
            const file = videoInput.files[0];
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (!file) {
                status.innerText = "Por favor, selecione um arquivo primeiro.";
                return;
            }

            try {
                cutBtn.disabled = true;
                status.innerText = "Carregando o motor FFmpeg...";

                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                status.innerText = "Processando vídeo...";

                // Escreve o arquivo selecionado na memória virtual do FFmpeg
                const fileName = file.name;
                const outputName = `corte_${Date.now()}.mp4`;

                ffmpeg.FS('writeFile', fileName, await fetchFile(file));

                // Executa o comando de corte rápido usando cópia de stream (-c copy)
                await ffmpeg.run('-i', fileName, '-ss', start, '-to', end, '-c', 'copy', outputName);

                // Lê o resultado da memória virtual
                const data = ffmpeg.FS('readFile', outputName);

                // Cria o link automático para baixar/salvar no celular
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = outputName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                status.innerText = "Vídeo cortado e salvo com sucesso!";

                // Limpa a memória interna
                ffmpeg.FS('unlink', fileName);
                ffmpeg.FS('unlink', outputName);

            } catch (err) {
                console.error(err);
                status.innerText = `Erro: ${err.message || 'Falha ao processar vídeo.'}`;
            } finally {
                cutBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
