<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corta Mídia Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card { background-color: #1e293b; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
    
    /* Hack para o botão de arquivo ser clicável */
    .file-input-wrapper { position: relative; margin-bottom: 20px; }
    .file-input-wrapper input { opacity: 0; position: absolute; z-index: -1; }
    .file-input-label { 
      display: block; width: 100%; padding: 15px; background-color: #334155; 
      border: 2px dashed #475569; border-radius: 8px; text-align: center; 
      color: #cbd5e1; cursor: pointer; transition: 0.3s;
    }
    .file-input-label:active { background-color: #475569; }

    .row { display: flex; gap: 10px; margin-bottom: 20px; }
    .form-group { flex: 1; }
    label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; display: block; }
    input[type="text"] { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; }

    button { width: 100%; padding: 14px; background-color: #0284c7; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #475569; }

    #status { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #94a3b8; }
  </style>

  <!-- Engine do FFmpeg -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

<div class="card">
  <h1>Corta Mídia Offline</h1>
  
  <div class="file-input-wrapper">
    <input type="file" id="videoFile" accept="video/*">
    <label for="videoFile" class="file-input-label" id="fileLabel">📁 Selecionar Vídeo</label>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Início</label>
      <input type="text" id="start" value="00:00:00">
    </div>
    <div class="form-group">
      <label>Fim</label>
      <input type="text" id="end" value="00:00:10">
    </div>
  </div>

  <button id="processBtn">Cortar e Salvar</button>
  <div id="status"></div>
</div>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;
  const ffmpeg = createFFmpeg({ log: false });

  const fileInput = document.getElementById('videoFile');
  const fileLabel = document.getElementById('fileLabel');
  const processBtn = document.getElementById('processBtn');
  const statusDiv = document.getElementById('status');

  // Atualiza label ao selecionar arquivo
  fileInput.addEventListener('change', () => {
    if(fileInput.files.length > 0) fileLabel.innerText = '✅ ' + fileInput.files[0].name;
  });

  processBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) { alert("Selecione um vídeo primeiro!"); return; }

    processBtn.disabled = true;
    statusDiv.innerText = "Carregando Engine (aguarde)...";

    try {
      if (!ffmpeg.isLoaded()) await ffmpeg.load();
      
      statusDiv.innerText = "Processando...";
      ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

      await ffmpeg.run(
        '-ss', document.getElementById('start').value,
        '-to', document.getElementById('end').value,
        '-i', 'input.mp4',
        '-c', 'copy',
        'output.mp4'
      );

      const data = ffmpeg.FS('readFile', 'output.mp4');
      const blob = new Blob([data.buffer], { type: 'video/mp4' });
      
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'corte.mp4';
      a.click();

      statusDiv.innerText = "Pronto! Vídeo baixado.";
    } catch (e) {
      statusDiv.innerText = "Erro: " + e.message;
    } finally {
      processBtn.disabled = false;
    }
  });
</script>

</body>
</html>
