name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Native Android WebView Project
      run: |
        mkdir -p android-app/app/src/main/assets/www
        mkdir -p android-app/app/src/main/java/com/cortamidia/app
        
        # Copia os arquivos do app
        cp -r templates app.py main.py android-app/app/src/main/assets/www/ 2>/dev/null || true
        
        # Manifest
        cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.cortamidia.app">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="CortaMidia"
                android:theme="@android:style/Theme.NoTitleBar">
                <activity android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # MainActivity Java
        cat << 'EOF' > android-app/app/src/main/java/com/cortamidia/app/MainActivity.java
        package com.cortamidia.app;

        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;

        public class MainActivity extends Activity {
            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setAllowFileAccess(true);
                webView.setWebViewClient(new WebViewClient());
                setContentView(webView);
                
                webView.loadUrl("file:///android_asset/www/templates/index.html");
            }
        }
        EOF

        # Build Gradle da raiz do projeto Android
        cat << 'EOF' > android-app/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat << 'EOF' > android-app/settings.gradle
        include ':app'
        EOF

        cat << 'EOF' > android-app/app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.cortamidia.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.cortamidia.app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF

    - name: Build APK with Gradle Action
      uses: gradle/actions/setup-gradle@v3
      with:
        build-root-directory: android-app
        arguments: assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CortaMidia-APK
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
