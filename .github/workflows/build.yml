name: Build Cordova APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create myApp com.cortamidia.app CortaMidia
        cd myApp
        cordova platform add android
        rm -rf www/*
        cp -r ../templates/* www/ 2>/dev/null || cp ../index.html www/

    - name: Build Android APK
      run: |
        cd myApp
        cordova build android --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
